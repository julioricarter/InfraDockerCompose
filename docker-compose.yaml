version: '0'

services:

  app1:
    container_name: app1
    build: ./hello-world-api
    ports:
      - "3000:3000" 
    environment:
      - MESSAGE=${MESSAGE}

  app2:
    container_name: app2
    build: ./hello-world-api
    ports:
      - "3001:3000" 
    environment:
      - MESSAGE=${MESSAGE}

  app3:
    container_name: app3
    build: ./hello-world-api
    ports:
      - "3002:3000" 
    environment:
      - MESSAGE=${MESSAGE}