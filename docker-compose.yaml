version: '0'

volumes:
  db-data:

services:

  app1:
    container_name: app1
    build: ./hello-world-api
    ports:
      - "3000:3000" 
    environment:
      - MESSAGE=${MESSAGE}

  app2:
    container_name: app2
    build: ./hello-world-api
    ports:
      - "3001:3000" 
    environment:
      - MESSAGE=${MESSAGE}

  app3:
    container_name: app3
    build: ./hello-world-api
    ports:
      - "3002:3000" 
    environment:
      - MESSAGE=${MESSAGE}

  db:
    container_name: db
    image: postgres:latest
    volumes:
      - db-data:/var/lib/postgresql/data  
    environment:
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"